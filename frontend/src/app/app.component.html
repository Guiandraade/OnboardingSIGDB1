<app-toast></app-toast>

<div class="loading-overlay" *ngIf="isLoading">
  <div class="loading-spinner"></div>
  <span class="loading-text">Loading...</span>
</div>

<div class="app-shell" [class.blurred]="isLoading">

  <header class="mobile-topbar">
    <button class="hamburger" (click)="toggleSidebar()" aria-label="Toggle menu">
      <span class="material-icons">{{ sidebarOpen ? 'close' : 'menu' }}</span>
    </button>
    <img src="assets/people-management-logo.svg" alt="People Management" class="mobile-topbar-logo">
  </header>

  <div class="sidebar-backdrop" *ngIf="sidebarOpen" (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.sidebar--open]="sidebarOpen">
    <div class="sidebar-brand">
      <img src="assets/people-management-logo.svg" alt="People Management logo" class="sidebar-brand-logo">
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
      <ul class="sidebar-nav-list">
        <li>
          <a routerLink="/home" routerLinkActive="active" class="sidebar-nav-link">
            <span class="sidebar-nav-content">
              <span class="material-icons sidebar-nav-icon">home</span>
              Home
            </span>
          </a>
        </li>
        <li>
          <a routerLink="/positions" routerLinkActive="active" class="sidebar-nav-link">
            <span class="sidebar-nav-content">
              <span class="material-icons sidebar-nav-icon">badge</span>
              Positions
            </span>
          </a>
        </li>
        <li>
          <a routerLink="/employees" routerLinkActive="active" class="sidebar-nav-link">
            <span class="sidebar-nav-content">
              <span class="material-icons sidebar-nav-icon">people</span>
              Employees
            </span>
          </a>
        </li>
        <li>
          <a routerLink="/companies" routerLinkActive="active" class="sidebar-nav-link">
            <span class="sidebar-nav-content">
              <span class="material-icons sidebar-nav-icon">business</span>
              Companies
            </span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <img src="assets/Senac_logo.svg" alt="Senac logo" class="sidebar-footer-logo">
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="page-header">
      <div class="breadcrumb" aria-label="Breadcrumb">
        <a routerLink="/home" class="breadcrumb-item breadcrumb-link">Home Page</a>
        <ng-container *ngIf="currentPageTitle !== 'Home'">
          <span class="breadcrumb-separator">/</span>
          <span class="breadcrumb-item breadcrumb-current">{{ currentPageTitle }}</span>
        </ng-container>
      </div>

      <div class="user-profile">
        <div class="user-info">
          <span class="user-name">Guilherme Nascimento</span>
          <span class="user-role">Administrator</span>
        </div>
        <div class="user-avatar-wrapper">
          <img class="user-avatar" src="assets/1777576099585.jpg" alt="Profile">
          <span class="user-avatar-status"></span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
