<div class="home-container">
  <div class="home-greeting">
    <h1 class="home-title">Hello, {{ user.firstName }}</h1>
    <p class="home-date">{{ today | date:'EEEE, MMMM d, yyyy' }}</p>
  </div>

  <div class="home-cards" *ngIf="!loading; else skeletons">
    <div class="home-card"
         (click)="navigateTo('/employees')"
         (keydown.enter)="navigateTo('/employees')"
         tabindex="0"
         role="link"
         aria-label="View all employees">
      <div class="home-card-icon">
        <span class="material-icons" aria-hidden="true">people</span>
      </div>
      <div class="home-card-info">
        <span class="home-card-total">{{ totalEmployees }}</span>
        <span class="home-card-label">Employees</span>
      </div>
      <div class="home-card-actions">
        <div class="home-card-footer">
          View all
          <span class="material-icons" aria-hidden="true">arrow_forward</span>
        </div>
        <a routerLink="/employees/new" class="home-card-new" (click)="$event.stopPropagation()" aria-label="New employee">+ New</a>
      </div>
    </div>

    <div class="home-card"
         (click)="navigateTo('/companies')"
         (keydown.enter)="navigateTo('/companies')"
         tabindex="0"
         role="link"
         aria-label="View all companies">
      <div class="home-card-icon">
        <span class="material-icons" aria-hidden="true">business</span>
      </div>
      <div class="home-card-info">
        <span class="home-card-total">{{ totalCompanies }}</span>
        <span class="home-card-label">Companies</span>
      </div>
      <div class="home-card-actions">
        <div class="home-card-footer">
          View all
          <span class="material-icons" aria-hidden="true">arrow_forward</span>
        </div>
        <a routerLink="/companies/new" class="home-card-new" (click)="$event.stopPropagation()" aria-label="New company">+ New</a>
      </div>
    </div>

    <div class="home-card"
         (click)="navigateTo('/positions')"
         (keydown.enter)="navigateTo('/positions')"
         tabindex="0"
         role="link"
         aria-label="View all positions">
      <div class="home-card-icon">
        <span class="material-icons" aria-hidden="true">badge</span>
      </div>
      <div class="home-card-info">
        <span class="home-card-total">{{ totalPositions }}</span>
        <span class="home-card-label">Positions</span>
      </div>
      <div class="home-card-actions">
        <div class="home-card-footer">
          View all
          <span class="material-icons" aria-hidden="true">arrow_forward</span>
        </div>
        <a routerLink="/positions/new" class="home-card-new" (click)="$event.stopPropagation()" aria-label="New position">+ New</a>
      </div>
    </div>
  </div>

  <ng-template #skeletons>
    <div class="home-cards">
      <div class="home-card skeleton" *ngFor="let i of [1,2,3]"></div>
    </div>
  </ng-template>
</div>
