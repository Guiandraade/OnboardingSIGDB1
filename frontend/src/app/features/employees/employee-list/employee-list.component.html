<div class="page-container">
  <div class="page-body-wrapper">
    <div class="page-content page-content--list">

      <div class="list-card">

        <div class="filter-section">
          <div class="filter-grid">
            <div class="filter-field">
              <label>Name</label>
              <input type="text" [(ngModel)]="filter.name" placeholder="Search by name..." (keyup.enter)="isLoading ? null : searchItems()">
            </div>
            <div class="filter-field">
              <label>CPF</label>
              <input type="text" [(ngModel)]="filter.cpf" placeholder="Search by CPF..." (keyup.enter)="isLoading ? null : searchItems()">
            </div>
            <div class="filter-field">
              <label>Hire date from</label>
              <div class="date-input-wrapper">
                <input type="text" class="date-display-input" readonly [value]="formatDate(filter.hiredFrom)" placeholder="dd/mm/aaaa" (keyup.enter)="isLoading ? null : searchItems()">
                <input type="date" class="date-hidden-input" [(ngModel)]="filter.hiredFrom" [max]="filter.hiredUntil || ''" (click)="openDatePicker($event)">
              </div>
            </div>
            <div class="filter-field">
              <label>Hire date until</label>
              <div class="date-input-wrapper">
                <input type="text" class="date-display-input" readonly [value]="formatDate(filter.hiredUntil)" placeholder="dd/mm/aaaa" (keyup.enter)="isLoading ? null : searchItems()">
                <input type="date" class="date-hidden-input" [(ngModel)]="filter.hiredUntil" [min]="filter.hiredFrom || ''" (click)="openDatePicker($event)">
              </div>
            </div>
          </div>
          <div class="filter-actions">
            <button type="button" class="btn-clear-filters" *ngIf="hasActiveFilters()" (click)="clearFilters()">Clear</button>
            <button type="button" class="btn-search" [disabled]="isLoading" (click)="searchItems()">Search</button>
            <a [routerLink]="isLoading ? null : ['/employees/new']" class="btn-create" [class.disabled]="isLoading" role="button">+ New employee</a>
          </div>
        </div>

        <div class="table-wrapper table-wrapper--scrollable">

          <div *ngIf="isLoading" class="skeleton-rows">
            <div class="skeleton-row" *ngFor="let i of [1,2,3,4,5]; trackBy: trackByIndex">
              <span class="skeleton skeleton-col--text"></span>
              <span class="skeleton skeleton-col--text"></span>
              <span class="skeleton skeleton-col--text"></span>
              <span class="skeleton skeleton-col--text"></span>
              <span class="skeleton skeleton-col--actions"></span>
            </div>
          </div>

          <table *ngIf="!isLoading">
            <thead>
              <tr>
                <th>Name</th>
                <th>CPF</th>
                <th>Company</th>
                <th>Position</th>
                <th class="col-actions-head col-actions-head--wide">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngIf="items.length === 0">
                <td colspan="5" class="empty-row">
                  <div class="empty-content">
                    <span class="material-icons empty-icon">people</span>
                    <span class="empty-title">No employees found</span>
                    <span class="empty-hint">Try adjusting your search terms</span>
                  </div>
                </td>
              </tr>

              <tr *ngFor="let item of items; trackBy: trackById" [class.row-pending-delete]="item.id === pendingDeleteId">
                <td data-label="Name"><span class="text-truncate" [title]="item.name">{{ item.name }}</span></td>
                <td data-label="CPF">{{ item.cpf | cpf }}</td>
                <td data-label="Company"><span class="text-truncate" [title]="item.companyName">{{ item.companyName }}</span></td>
                <td data-label="Position"><span class="text-truncate" [title]="item.currentPosition">{{ item.currentPosition }}</span></td>
                <td class="td-actions">
                  <div class="row-actions">
                    <a [routerLink]="['/employees', item.id]" class="btn-icon btn-icon--details" title="View details" aria-label="View details">
                      <span class="material-icons" aria-hidden="true">person</span>
                    </a>
                    <a [routerLink]="['/employees/edit', item.id]" class="btn-icon btn-icon--edit" title="Edit" aria-label="Edit employee">
                      <span class="material-icons" aria-hidden="true">edit</span>
                    </a>
                    <button type="button" class="btn-icon btn-icon--delete" title="Delete" aria-label="Delete employee"
                      [disabled]="isLoading"
                      (click)="confirmDelete(item.id, item.name)">
                      <span class="material-icons" aria-hidden="true">delete</span>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>

        </div>

        <app-pagination
          [currentPage]="filter.pageNumber || 1"
          [totalPages]="totalPages"
          [totalItems]="totalItems"
          [pageSize]="filter.pageSize || 5"
          [isLoading]="isLoading"
          (pageChange)="goToPage($event)"
          (pageSizeChange)="changePageSize($event)">
        </app-pagination>

      </div>

    </div>
  </div>
</div>

<app-confirm-delete
  [visible]="pendingDeleteId !== null"
  title="Delete employee"
  [name]="pendingDeleteName"
  (confirmed)="deleteItem(pendingDeleteId!)"
  (cancelled)="cancelDelete()">
</app-confirm-delete>
