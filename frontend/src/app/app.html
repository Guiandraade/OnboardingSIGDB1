<app-toast></app-toast>

<div class="app-shell">

  <div class="mobile-topbar">
    <button class="hamburger" (click)="toggleSidebar()" [attr.aria-expanded]="sidebarOpen" aria-label="Abrir menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <span class="mobile-brand">SIGDB</span>
  </div>

  <div class="sidebar-overlay" [class.sidebar-overlay--visible]="sidebarOpen" (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.sidebar--open]="sidebarOpen">
    <div class="sidebar-brand">
      <span class="brand-name">SIGDB</span>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">Records</span>

      <a routerLink="/companies" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18"/>
          <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/>
          <path d="M9 21v-4h6v4"/>
        </svg>
        Companies
      </a>

      <a routerLink="/positions" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
        </svg>
        Positions
      </a>
    </nav>

    <div class="sidebar-profile">
      <div class="profile-avatar">G</div>
      <div class="profile-info">
        <span class="profile-name">Guest</span>
        <span class="profile-email">guest@sigdb.com</span>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
