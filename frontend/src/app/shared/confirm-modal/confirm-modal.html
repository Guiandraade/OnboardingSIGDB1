<div class="modal-backdrop" *ngIf="visible" (click)="onCancel()">
  <div class="modal-panel" (click)="$event.stopPropagation()">

    <div class="modal-icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        <path d="M10 11v6"></path>
        <path d="M14 11v6"></path>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
      </svg>
    </div>

    <h2 class="modal-title">Delete {{ entityName }}?</h2>
    <p class="modal-message">This action cannot be undone.</p>

    <div class="modal-actions">
      <button type="button" class="btn-modal-cancel" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn-modal-delete" (click)="onConfirm()">Delete</button>
    </div>

  </div>
</div>
