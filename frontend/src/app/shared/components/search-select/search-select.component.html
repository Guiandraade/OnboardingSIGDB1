<label class="form-label" [for]="inputId">
  {{ label }} <span class="form-required">*</span>
</label>
<div class="select-search-wrapper">
  <input
    [id]="inputId"
    type="text"
    class="form-control"
    [class.is-invalid]="control?.invalid && control?.touched"
    [value]="searchText"
    [placeholder]="placeholder"
    autocomplete="off"
    (input)="onInput($event)"
    (focus)="showDropdown = true"
    (blur)="onBlur()"
  >
  <span class="material-icons select-search-caret">expand_more</span>
  <div class="select-search-list" *ngIf="showDropdown">
    <div class="select-search-item"
      *ngFor="let item of filteredItems; trackBy: trackByIndex"
      (mousedown)="$event.preventDefault(); selectItem(item)">
      {{ item.displayName }}
    </div>
    <div class="select-search-empty" *ngIf="filteredItems.length === 0">
      {{ emptyMessage }}
    </div>
  </div>
</div>
<span class="form-error" *ngIf="control?.touched && control?.hasError('required')">{{ requiredMessage }}</span>
<span class="form-error" *ngIf="control?.hasError('serverError')">{{ control?.getError('serverError') }}</span>
